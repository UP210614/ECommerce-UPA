trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'ddf71576-3ea7-4417-9f12-743b5912f938'
  imageRepository: 'backend'
  containerRegistry: 'ecommercecontainer.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)\backend\Dockerfile'
  tag: '$(Build.BuildId)'

pool:
  name: 'Default'
  demands:
    - agent.name -equals agentP  # Cambia esto por el nombre de tu agente si es distinto

stages:
# Etapa 1: Compilar el .jar con Gradle
- stage: Build_Jar
  displayName: "Compilar el .jar con Gradle"
  jobs:
    - job: GradleBuild
      displayName: "Compilar .jar"
      steps:
        - task: Gradle@3
          inputs:
            workingDirectory: 'backend'
            gradleWrapperFile: 'backend\gradlew.bat'
            gradleOptions: '-Xmx1024m'
            tasks: bootJar
            publishJUnitResults: false

        - task: CopyFiles@2
          inputs:
            contents: '**/build/libs/*.jar'
            targetFolder: '$(Build.ArtifactStagingDirectory)'

        - publish: $(Build.ArtifactStagingDirectory)
          artifact: drop

# Etapa 2: Construir imagen Docker y subir a ACR
- stage: Build_And_Push_Image
  displayName: "Construir imagen y subir a ACR"
  dependsOn: Build_Jar
  jobs:
    - job: DockerBuild
      displayName: "Docker Build & Push"
      pool:
        name: 'Default'
        demands:
          - agent.name -equals agentP
      steps:
        - download: current
          artifact: drop

        - task: CmdLine@2
          displayName: 'Copiar .jar al contexto backend/build/libs'
          inputs:
            script: |
              if not exist backend\build\libs mkdir backend\build\libs
              copy "$(Pipeline.Workspace)\drop\*.jar" backend\build\libs\

        - task: Docker@2
          displayName: "Construir y subir imagen a ACR"
          inputs:
            command: buildAndPush
            repository: $(imageRepository)
            dockerfile: $(dockerfilePath)
            containerRegistry: $(dockerRegistryServiceConnection)
            tags: |
              $(tag)
