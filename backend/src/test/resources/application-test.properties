# Base de datos embebida para pruebas
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configurado para pruebas (limpiar datos al finalizar)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Evitar errores de variables no resueltas durante tests
MYSQL_URL=jdbc:h2:mem:testdb
MYSQL_USER=sa
MYSQL_PASSWORD=
BACKEND_PORT=8081

# Nivel de log para depuración de pruebas
logging.level.org.springframework.boot.context.properties=DEBUG
